# Nav2 parameters for RL training: planner only.
#
# Deliberately absent:
#   * controller_server / DWB   - the RL policy owns /cmd_vel
#   * velocity_smoother, behavior_server, waypoint_follower - would publish /cmd_vel
#   * local_costmap             - unused by architecture A
#   * global_costmap obstacle_layer - training obstacles must NOT bend the global
#     path; they exist only in Gazebo and are perceived through /scan
#
# The amcl block is used only when the launch file is started with use_amcl:=true
# (hardware deployment). Training runs with a static map->odom transform instead.

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "/home/kim/limo_ws/map.yaml"
    topic_name: "map"
    frame_id: "map"

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.15,0.10],[0.15,-0.10],[-0.15,-0.10],[-0.15,0.10]]"
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      always_send_full_costmap: true
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "nav2_amcl::LikelihoodFieldModel"
    laser_max_range: 8.0
    laser_min_range: 0.2
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
